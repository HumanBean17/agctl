# git-cliff configuration — generates CHANGELOG.md and GitHub Release bodies
# from Conventional Commits.
#
#   Regenerate full history:   git-cliff --output CHANGELOG.md
#   Latest tag only (body):    git-cliff --latest --strip header
#
# `body` is intentionally omitted — git-cliff's built-in template groups commits
# by the `group` set below, per tag.

[changelog]
header = """
# Changelog

All notable changes to agctl are documented here. Generated by
[git-cliff](https://github.com/orhun/git-cliff) from Conventional Commits — do
not edit by hand; commit Conventional-Commit messages instead.

"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true     # drop non-conventional noise (e.g. old "bump version" commits)
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^(ci|build)", group = "Build & CI" },
    { message = "^chore", group = "Miscellaneous" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
