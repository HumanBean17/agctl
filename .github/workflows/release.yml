name: release

# Tag-driven release. Pushing a v* tag builds the package, publishes to PyPI via
# trusted publishing (OIDC — no stored tokens) and opens a GitHub Release whose
# body git-cliff generates from Conventional Commits. The version is derived
# from the tag by hatch-vcs, so version and tag can never drift. The GitHub
# Releases page is the changelog (main is PR-protected — no in-repo CHANGELOG).
# See docs/RELEASING.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # commit CHANGELOG.md back + create the GitHub Release
  id-token: write    # PyPI trusted publishing (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi   # the PyPI trusted publisher is scoped to this environment
    steps:
      - name: Checkout (full history — hatch-vcs + git-cliff read tag history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: pip install -U build twine git-cliff

      - name: Generate GitHub Release body (this tag's Conventional Commits)
        run: git-cliff --latest --strip header --output RELEASE_BODY.md

      - name: Build sdist + wheel
        run: python -m build

      - name: twine check (metadata renders; catches a permanently-blank PyPI page)
        run: twine check dist/*

      - name: Verify the built version equals the tag
        run: |
          python - <<'PY'
          import glob, os, sys
          from pathlib import Path
          whl = next(iter(glob.glob("dist/agctl-*.whl")))
          built = Path(whl).name.split("-")[1]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          print(f"built={built} tag={tag}")
          sys.exit(0 if built == tag else 1)
          PY

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: dist/*
